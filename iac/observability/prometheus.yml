# Prometheus 配置（M5.3 可观测栈，observability profile）。
#
# 单机实验室：firepaas-api 与 Prometheus 同机；容器内经
# host.docker.internal 访问宿主 8081 的 /metrics（e2e-m5 端口）。
# 告警规则文件 alerts.yml 与 capacity model 阈值同步维护。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: firepaas-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
    # 宿主服务稳定性优先：抓取失联不阻断 Prometheus 自身。
    scrape_timeout: 10s
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
