# 本地开发依赖(P1.1):postgres / redis / minio
# 用法:make dev-up(或 docker compose -f iac/dev/docker-compose.yaml up -d)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firepaas
      POSTGRES_PASSWORD: firepaas
      POSTGRES_DB: firepaas
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: firepaas
      MINIO_ROOT_PASSWORD: firepaas-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # 共享 OCI registry(M3 镜像 digest/缓存/预热依赖;实验室/生产形态见 iac/README.md)
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  # M5.3 可观测栈（默认不启动）：docker compose --profile observability up -d
  # 详见 iac/observability/README（数据源/dashboard provisioning 已入仓）。
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  pg-data:
  redis-data:
  minio-data:
  registry-data:
