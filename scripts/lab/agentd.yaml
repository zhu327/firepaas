# LAYER: l1-base  PREREQ: -  DESTRUCTIVE: -  FROZEN: no
# agentd M1 配置（复用 P0 数据目录：系统内核/initrd 与镜像缓存已就绪）。
# P0 hypeman job 与 agentd 不得同时运行（共享 data_dir 会互相覆盖实例状态）。

jwt_secret: "dev-agentd-m1"

# 与 scripts/lab/hypeman-p0.yaml 相同，避免重复下载内核/initrd
data_dir: /var/lib/firepaas-p0/hypeman

hypervisor:
  default: firecracker

network:
  subnet_cidr: 10.100.0.0/16
  # 显式 bridge：hypeman 的 default network 以“已存在的 bridge 状态”为准；
  # 不指定时会采纳宿主的 vmbr0（10.101.0.1/16，Proxmox），导致 guest IP
  # 与 slot bridge 子网不一致（readiness 探测回包无网关 → 永远 NOT_READY）。
  # firepaas0 已存在且为 10.100.0.1/16，与本文件子网一致。
  bridge_name: firepaas0
  dns_server: 223.5.5.5

logging:
  level: info

env: lab
