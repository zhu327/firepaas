# hypeman is consumed as a remote module via go.mod's replace directive
# (github.com/zhu327/hypeman v0.4.0-firepaas); the tag embeds the required
# firecracker/guest-agent/init binaries, so no sibling checkout is needed.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"

      - name: Build + vet
        run: |
          GOWORK=off go build ./...
          GOWORK=off go vet ./...

      - name: Test + scheduler simulation
        run: |
          GOWORK=off go test ./...
          GOWORK=off go run ./tools/sim -n 100000

      - name: go.mod/go.sum tidy check
        run: GOWORK=off make tidy-check

      - name: Shell and Nomad syntax
        run: |
          bash -n scripts/lab/*.sh
          curl -fsSL -o /tmp/nomad.zip https://releases.hashicorp.com/nomad/1.10.5/nomad_1.10.5_linux_amd64.zip
          unzip -q /tmp/nomad.zip -d /tmp
          /tmp/nomad fmt -check iac/nomad
          /tmp/nomad job validate -var-file=iac/nomad/ci/agent.vars.hcl iac/nomad/agent.hcl
          /tmp/nomad job validate iac/nomad/agentd-single.hcl
          /tmp/nomad job validate -var-file=iac/nomad/ci/control-plane.vars.hcl iac/nomad/control-plane.hcl
          /tmp/nomad job validate -var-file=iac/nomad/ci/edge.vars.hcl iac/nomad/edge.hcl

  proto:
    # Generated code consistency only. API/breaking checks remain in contract tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
      - name: Install protoc + plugins
        run: bash scripts/lab/install-protoc.sh
      - name: Regenerate and diff
        run: |
          make proto
          # Fail closed: an empty or untracked generated tree is never success.
          test -n "$(find shared/gen -type f -name '*.pb.go' -print -quit)"
          git diff --exit-code -- shared/gen/
          test -z "$(git status --porcelain --untracked-files=all -- shared/gen/)"
